<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <linearGradient id="p6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30141D"/>
      <stop offset="50%" stop-color="#201016"/>
      <stop offset="100%" stop-color="#141012"/>
    </linearGradient>
    <linearGradient id="gold6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF3DA"/>
      <stop offset="100%" stop-color="#C9A24B"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1280" fill="url(#p6)"/>
  <rect x="20" y="20" width="680" height="1240" rx="24" fill="none" stroke="url(#gold6)" stroke-width="1.5" opacity="0.4"/>

  <!-- Velvet & Silk Kurti Silhouette -->
  <g transform="translate(360, 500)">
    <!-- Traditional Tilla Embroidery Neckline -->
    <path d="M -80 -180 L 80 -180 L 60 -40 L 0 40 L -60 -40 Z" fill="#421323" stroke="url(#gold6)" stroke-width="3"/>
    <path d="M 0 -180 L 0 100" stroke="url(#gold6)" stroke-width="3"/>
    <!-- Flowing Velvet Kurti -->
    <path d="M -160 -160 L 160 -160 L 220 380 L -220 380 Z" fill="#200B14" stroke="url(#gold6)" stroke-width="1.5"/>
    <!-- Golden Motifs / Booti work -->
    <circle cx="-100" cy="80" r="8" fill="url(#gold6)"/>
    <circle cx="100" cy="80" r="8" fill="url(#gold6)"/>
    <circle cx="-130" cy="220" r="8" fill="url(#gold6)"/>
    <circle cx="130" cy="220" r="8" fill="url(#gold6)"/>
    <circle cx="0" cy="260" r="10" fill="url(#gold6)"/>
  </g>

  <g transform="translate(360, 1080)">
    <text x="0" y="-40" font-family="'Poppins', sans-serif" font-size="16" font-weight="600" fill="#C9A24B" text-anchor="middle" letter-spacing="4">FESTIVE LOOKBOOK</text>
    <text x="0" y="5" font-family="'Playfair Display', serif" font-size="28" font-weight="600" fill="#FFF8F1" text-anchor="middle">Velvet &amp; Silk Festive Edit</text>
    <text x="0" y="38" font-family="'Poppins', sans-serif" font-size="14" fill="#D8BDC4" text-anchor="middle">Festive Wear &amp; Heirloom Jewellery</text>
  </g>
</svg>
