<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F181B"/>
      <stop offset="50%" stop-color="#2D1520"/>
      <stop offset="100%" stop-color="#141012"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED596"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#947126"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E23E6B"/>
      <stop offset="100%" stop-color="#B3123F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#B3123F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#141012" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  <circle cx="400" cy="380" r="320" fill="url(#glow)"/>
  <circle cx="650" cy="200" r="180" fill="#C9A24B" opacity="0.1" filter="url(#softBlur)"/>

  <!-- Arch Frame Outline Background -->
  <path d="M 120 400 A 280 280 0 0 1 680 400 L 680 920 A 40 40 0 0 1 640 960 L 160 960 A 40 40 0 0 1 120 920 Z" fill="#241B20" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Inner Aesthetic Fashion Illustration Artwork -->
  <g transform="translate(0, 40)">
    <!-- Soft Glow Silhouette Background -->
    <ellipse cx="400" cy="460" rx="200" ry="260" fill="#3A222C" opacity="0.8"/>
    
    <!-- Stylized Haute Couture Silhouette -->
    <!-- Head / Hair -->
    <path d="M 330 290 Q 400 170 470 290 Q 510 400 480 500 Q 450 400 400 400 Q 350 400 320 500 Q 290 400 330 290 Z" fill="#141012" opacity="0.95"/>
    <ellipse cx="400" cy="330" rx="55" ry="75" fill="#E8C5AF"/>
    
    <!-- Elegant features hint -->
    <path d="M 370 320 Q 385 315 395 322" stroke="#684A3B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 405 322 Q 415 315 430 320" stroke="#684A3B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 388 355 Q 400 365 412 355" stroke="#B3123F" stroke-width="3" fill="#B3123F" stroke-linecap="round"/>
    
    <!-- Traditional Kundan Jhumka Earring hints -->
    <circle cx="338" cy="350" r="4" fill="#C9A24B"/>
    <polygon points="334,356 342,356 338,370" fill="url(#goldGrad)"/>
    <circle cx="462" cy="350" r="4" fill="#C9A24B"/>
    <polygon points="458,356 466,356 462,370" fill="url(#goldGrad)"/>

    <!-- Fashion Modest Corset / Luxury Ensemble -->
    <path d="M 345 405 Q 400 425 455 405 L 485 540 Q 400 560 315 540 Z" fill="url(#roseGrad)"/>
    <path d="M 360 410 L 375 545 M 400 415 L 400 550 M 425 415 L 440 545" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.8"/>
    
    <!-- Flowing Dupatta / Fabric Drape -->
    <path d="M 315 440 Q 240 550 260 780 Q 350 820 400 800 Q 450 820 540 780 Q 560 550 485 440 Q 450 620 400 620 Q 350 620 315 440 Z" fill="#2C121D" opacity="0.9" stroke="url(#goldGrad)" stroke-width="1.5"/>
    
    <!-- Golden bangles / accessories on wrists -->
    <ellipse cx="290" cy="620" rx="14" ry="7" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <ellipse cx="292" cy="626" rx="14" ry="7" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <ellipse cx="510" cy="620" rx="14" ry="7" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <ellipse cx="508" cy="626" rx="14" ry="7" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  </g>

  <!-- Luxury Monogram Badge Overlay -->
  <g transform="translate(400, 860)">
    <rect x="-160" y="-35" width="320" height="70" rx="35" fill="#141012" fill-opacity="0.88" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <text x="0" y="-5" font-family="'Playfair Display', 'Cormorant Garamond', serif" font-size="19" font-weight="600" fill="#FFF8F1" text-anchor="middle" letter-spacing="3">KHADIJA MIRZA</text>
    <text x="0" y="18" font-family="'Poppins', sans-serif" font-size="11" font-weight="400" fill="#C9A24B" text-anchor="middle" letter-spacing="4">CONTENT CREATOR</text>
  </g>

  <!-- Sparkles & Accents -->
  <polygon points="200,280 205,295 220,300 205,305 200,320 195,305 180,300 195,295" fill="url(#goldGrad)" opacity="0.75"/>
  <polygon points="620,360 623,372 635,375 623,378 620,390 617,378 605,375 617,372" fill="url(#goldGrad)" opacity="0.6"/>
</svg>
