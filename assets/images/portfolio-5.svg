<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <linearGradient id="p5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1828"/>
      <stop offset="50%" stop-color="#14121F"/>
      <stop offset="100%" stop-color="#141012"/>
    </linearGradient>
    <linearGradient id="gold5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DB"/>
      <stop offset="100%" stop-color="#C9A24B"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1280" fill="url(#p5)"/>
  <rect x="20" y="20" width="680" height="1240" rx="24" fill="none" stroke="url(#gold5)" stroke-width="1.5" opacity="0.4"/>

  <!-- Luxury Handbag Illustration -->
  <g transform="translate(360, 500)">
    <!-- Bag Handle -->
    <path d="M -70 -40 Q 0 -160 70 -40" fill="none" stroke="url(#gold5)" stroke-width="12" stroke-linecap="round"/>
    <!-- Bag Body -->
    <path d="M -160 -40 L 160 -40 L 130 180 L -130 180 Z" fill="#B3123F" stroke="url(#gold5)" stroke-width="3"/>
    <!-- Bag Flap -->
    <path d="M -160 -40 L 160 -40 L 120 70 L 0 110 L -120 70 Z" fill="#880C2F" stroke="url(#gold5)" stroke-width="2"/>
    <!-- Gold Lock Clasp -->
    <rect x="-24" y="80" width="48" height="40" rx="8" fill="url(#gold5)"/>
    <circle cx="0" cy="100" r="7" fill="#141012"/>
    <!-- Quilted stitch lines -->
    <line x1="-120" y1="-20" x2="60" y2="160" stroke="#FFF8F1" stroke-width="1" opacity="0.3"/>
    <line x1="-60" y1="-35" x2="120" y2="145" stroke="#FFF8F1" stroke-width="1" opacity="0.3"/>
    <line x1="120" y1="-20" x2="-60" y2="160" stroke="#FFF8F1" stroke-width="1" opacity="0.3"/>
    <line x1="60" y1="-35" x2="-120" y2="145" stroke="#FFF8F1" stroke-width="1" opacity="0.3"/>
  </g>

  <g transform="translate(360, 1080)">
    <text x="0" y="-40" font-family="'Poppins', sans-serif" font-size="16" font-weight="600" fill="#C9A24B" text-anchor="middle" letter-spacing="4">BUSINESS PROMOTIONS</text>
    <text x="0" y="5" font-family="'Playfair Display', serif" font-size="28" font-weight="600" fill="#FFF8F1" text-anchor="middle">Luxury Handbag Campaign</text>
    <text x="0" y="38" font-family="'Poppins', sans-serif" font-size="14" fill="#D8BDC4" text-anchor="middle">Product Showcase &amp; Styling Integration</text>
  </g>
</svg>
