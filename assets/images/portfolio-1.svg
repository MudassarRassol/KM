<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <linearGradient id="p1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D1223"/>
      <stop offset="60%" stop-color="#1E1017"/>
      <stop offset="100%" stop-color="#141012"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E1B9"/>
      <stop offset="100%" stop-color="#C9A24B"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1280" fill="url(#p1)"/>
  <circle cx="360" cy="500" r="300" fill="#B3123F" opacity="0.2"/>
  <rect x="20" y="20" width="680" height="1240" rx="24" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.4"/>

  <!-- Illustration: Corset & Modest Styling -->
  <g transform="translate(360, 560)">
    <path d="M -110 -200 Q 0 -120 110 -200 L 140 120 Q 0 170 -140 120 Z" fill="#B3123F" stroke="url(#gold)" stroke-width="2"/>
    <!-- Lace-up corset detail -->
    <path d="M -40 -160 L 40 -120 M -40 -120 L 40 -80 M -40 -80 L 40 -40 M -40 -40 L 40 0 M -40 0 L 40 40 M -40 40 L 40 80" stroke="#FFF8F1" stroke-width="3" stroke-linecap="round"/>
    <!-- Flowing pleated skirt -->
    <path d="M -150 140 Q 0 180 150 140 L 220 500 Q 0 540 -220 500 Z" fill="#24141C" opacity="0.95" stroke="url(#gold)" stroke-width="1"/>
  </g>

  <!-- Title & category watermark -->
  <g transform="translate(360, 1080)">
    <text x="0" y="-40" font-family="'Poppins', sans-serif" font-size="16" font-weight="600" fill="#C9A24B" text-anchor="middle" letter-spacing="4">FASHION &amp; STYLING</text>
    <text x="0" y="5" font-family="'Playfair Display', serif" font-size="28" font-weight="600" fill="#FFF8F1" text-anchor="middle">Corset &amp; Modest Fusion</text>
    <text x="0" y="38" font-family="'Poppins', sans-serif" font-size="14" fill="#D8BDC4" text-anchor="middle">9:16 Cinematic Lookbook Reel</text>
  </g>
</svg>
