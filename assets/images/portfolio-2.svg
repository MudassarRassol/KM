<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <linearGradient id="p2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231911"/>
      <stop offset="50%" stop-color="#1B1317"/>
      <stop offset="100%" stop-color="#141012"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#805B19"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1280" fill="url(#p2)"/>
  <rect x="20" y="20" width="680" height="1240" rx="24" fill="none" stroke="url(#gold2)" stroke-width="1.5" opacity="0.4"/>

  <!-- Jewellery Illustration: Bangles & Jhumka -->
  <g transform="translate(360, 480)">
    <!-- Jhumka Earring Centerpiece -->
    <circle cx="0" cy="-140" r="18" fill="url(#gold2)"/>
    <polygon points="-50,-80 50,-80 0,-130" fill="url(#gold2)"/>
    <path d="M -80 -70 C -80 30 80 30 80 -70 Z" fill="#2E1C12" stroke="url(#gold2)" stroke-width="4"/>
    <!-- Small hanging pearls -->
    <circle cx="-60" cy="45" r="7" fill="#FFF8F1"/>
    <circle cx="-30" cy="50" r="7" fill="#FFF8F1"/>
    <circle cx="0" cy="53" r="8" fill="#FFF8F1"/>
    <circle cx="30" cy="50" r="7" fill="#FFF8F1"/>
    <circle cx="60" cy="45" r="7" fill="#FFF8F1"/>
    
    <!-- Stack of Traditional Bangles -->
    <ellipse cx="0" cy="220" rx="160" ry="42" fill="none" stroke="url(#gold2)" stroke-width="8"/>
    <ellipse cx="0" cy="245" rx="160" ry="42" fill="none" stroke="#B3123F" stroke-width="6"/>
    <ellipse cx="0" cy="270" rx="160" ry="42" fill="none" stroke="url(#gold2)" stroke-width="10"/>
    <ellipse cx="0" cy="295" rx="160" ry="42" fill="none" stroke="#B3123F" stroke-width="6"/>
    <ellipse cx="0" cy="320" rx="160" ry="42" fill="none" stroke="url(#gold2)" stroke-width="8"/>
  </g>

  <g transform="translate(360, 1080)">
    <text x="0" y="-40" font-family="'Poppins', sans-serif" font-size="16" font-weight="600" fill="#C9A24B" text-anchor="middle" letter-spacing="4">JEWELLERY &amp; BANGLES</text>
    <text x="0" y="5" font-family="'Playfair Display', serif" font-size="28" font-weight="600" fill="#FFF8F1" text-anchor="middle">Traditional Kundan &amp; Bangle Stack</text>
    <text x="0" y="38" font-family="'Poppins', sans-serif" font-size="14" fill="#D8BDC4" text-anchor="middle">Macro Details &amp; Styling Shoot</text>
  </g>
</svg>
