<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280">
  <defs>
    <linearGradient id="p4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1B28"/>
      <stop offset="50%" stop-color="#1E131C"/>
      <stop offset="100%" stop-color="#141012"/>
    </linearGradient>
    <linearGradient id="gold4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2"/>
      <stop offset="100%" stop-color="#C9A24B"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1280" fill="url(#p4)"/>
  <rect x="20" y="20" width="680" height="1240" rx="24" fill="none" stroke="url(#gold4)" stroke-width="1.5" opacity="0.4"/>

  <!-- Vlog & GRWM Artwork -->
  <g transform="translate(360, 480)">
    <!-- Vanity Mirror Oval -->
    <ellipse cx="0" cy="0" rx="180" ry="220" fill="#251621" stroke="url(#gold4)" stroke-width="3"/>
    <circle cx="0" cy="-60" r="45" fill="#E8C5AF"/>
    <!-- Makeup brushes & perfume bottle -->
    <rect x="-100" y="80" width="40" height="60" rx="8" fill="url(#gold4)"/>
    <rect x="-90" y="65" width="20" height="15" rx="3" fill="#FFF8F1"/>
    <!-- Coffee Cup / Lahore Cafe -->
    <path d="M 50 90 L 95 90 L 85 140 L 60 140 Z" fill="#FFF8F1"/>
    <path d="M 95 100 Q 115 110 90 125" fill="none" stroke="#FFF8F1" stroke-width="4"/>
    <!-- Steam -->
    <path d="M 68 80 Q 64 65 72 50" fill="none" stroke="#D8BDC4" stroke-width="2"/>
    <path d="M 78 80 Q 82 65 76 50" fill="none" stroke="#D8BDC4" stroke-width="2"/>
  </g>

  <g transform="translate(360, 1080)">
    <text x="0" y="-40" font-family="'Poppins', sans-serif" font-size="16" font-weight="600" fill="#C9A24B" text-anchor="middle" letter-spacing="4">LIFESTYLE VLOGS</text>
    <text x="0" y="5" font-family="'Playfair Display', serif" font-size="28" font-weight="600" fill="#FFF8F1" text-anchor="middle">A Day in Lahore &amp; GRWM</text>
    <text x="0" y="38" font-family="'Poppins', sans-serif" font-size="14" fill="#D8BDC4" text-anchor="middle">Aesthetic Morning Routine &amp; Cafe Run</text>
  </g>
</svg>
